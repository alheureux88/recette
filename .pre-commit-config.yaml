repos:
  - repo: local
    hooks:
      # Rapide : ne portent que sur les fichiers Python stagés.
      - id: ruff-fix
        name: ruff auto-fix
        entry: uv run ruff check --fix
        language: system
        types: [python]

      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]

      # Projet entier, mais via `uv run` (pas de venv nox reconstruit à
      # chaque commit). Ne tournent que si des fichiers Python sont stagés.
      - id: vulture
        name: vulture (dead code)
        entry: uv run vulture --config pyproject.toml
        language: system
        types: [python]
        pass_filenames: false

      - id: mypy
        name: mypy (strict)
        entry: uv run mypy src/recipes
        language: system
        types: [python]
        pass_filenames: false

      - id: pytest
        name: pytest
        entry: uv run pytest -q
        language: system
        types: [python]
        pass_filenames: false
