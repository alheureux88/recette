repos:
  - repo: local
    hooks:
      - id: ruff-fix
        name: ruff auto-fix
        entry: uv run ruff check --fix src tests noxfile.py
        language: system
        pass_filenames: false
        always_run: true

      - id: ruff-format
        name: ruff format
        entry: uv run ruff format src tests noxfile.py
        language: system
        pass_filenames: false
        always_run: true

      - id: nox-typecheck
        name: nox typecheck
        entry: nox -s typecheck
        language: system
        pass_filenames: false
        always_run: true

      - id: nox-test
        name: nox test
        entry: nox -s test
        language: system
        pass_filenames: false
        always_run: true
