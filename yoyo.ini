[DEFAULT]

# Dossier des migrations, embarqué dans le package (relatif à ce fichier).
sources = %(here)s/src/recipes/migrations

# Base de production (conteneur). En local : yoyo apply --database sqlite:///./recipes.db
database = sqlite:////data/recipes.db

# Pas de prompt interactif (démarrage conteneur / CI).
batch_mode = on
