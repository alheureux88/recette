<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Recettes Merizzi{% endblock %}</title>
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <header>
        <div class="header-inner">
            <a href="/" class="site-title">🍲 Recettes Merizzi</a>
            <nav class="header-nav">
                {% if auth_enabled %}
                    {% if user %}
                        <a href="/favorites" class="nav-link">Mes favoris</a>
                        {% if is_admin %}
                        <a href="/admin" class="nav-link">Administration</a>
                        {% endif %}
                        <span class="nav-user">{{ user.name or user.sub }}</span>
                        <a href="{{ logout_url }}" class="nav-link nav-logout">Déconnexion</a>
                    {% else %}
                        <a href="{{ login_url }}" class="nav-link nav-login">Connexion</a>
                    {% endif %}
                {% endif %}
            </nav>
        </div>
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
