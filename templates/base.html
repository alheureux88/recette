<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Recettes Merizzi{% endblock %}</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <script>
        (function () {
            var saved = localStorage.getItem('theme');
            var theme = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            document.documentElement.dataset.theme = theme;
        })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    {% block head %}{% endblock %}
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <header>
        <div class="header-inner">
            <a href="/" class="site-title">Recettes <span>Merizzi</span></a>
            <nav class="header-nav">
                <button type="button" class="theme-toggle" id="theme-toggle" aria-label="Basculer clair / sombre"></button>
                {% if auth_enabled %}
                    {% if user %}
                        <a href="/favorites" class="nav-link">Mes favoris</a>
                        {% if is_admin %}
                        <a href="/admin" class="nav-link">Administration</a>
                        {% endif %}
                        <span class="nav-user">{{ user.name or user.sub }}</span>
                        <a href="{{ logout_url }}" class="nav-link nav-logout">Déconnexion</a>
                    {% else %}
                        <a href="{{ login_url }}" class="nav-link nav-login">Connexion</a>
                    {% endif %}
                {% endif %}
            </nav>
        </div>
    </header>
    <main class="{% block main_class %}{% endblock %}">
        {% block content %}{% endblock %}
    </main>
    <script>
        (function () {
            var toggle = document.getElementById('theme-toggle');
            function refreshIcon() {
                toggle.textContent = document.documentElement.dataset.theme === 'dark' ? '\u2600\uFE0F' : '\uD83C\uDF19';
            }
            refreshIcon();
            toggle.addEventListener('click', function () {
                var next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
                document.documentElement.dataset.theme = next;
                try { localStorage.setItem('theme', next); } catch (e) {}
                refreshIcon();
            });
        })();
    </script>
</body>
</html>
