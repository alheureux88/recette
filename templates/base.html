<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Recettes Merizzi{% endblock %}</title>
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="48x48" href="/static/favicon-48x48.png">
    <link rel="icon" type="image/png" sizes="64x64" href="/static/favicon-64x64.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.png">
    <link rel="manifest" href="/static/manifest.webmanifest">
    <meta name="theme-color" content="#8a3324">
    <script>
        (function () {
            var saved = localStorage.getItem('theme');
            var theme = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            document.documentElement.dataset.theme = theme;
        })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    {% block head %}{% endblock %}
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="{% block body_class %}{% endblock %}">
    <header>
        <div class="header-inner">
            <a href="/" class="site-title">
                <img src="/static/favicon-64x64.png" alt="" class="site-logo" width="32" height="32">
                <span>Recettes <em>Merizzi</em></span>
            </a>
            <nav class="header-nav">
                <button type="button" class="theme-toggle" id="theme-toggle" aria-label="Basculer clair / sombre"></button>
                {% if auth_enabled %}
                    {% if user %}
                        <a href="/favorites" class="nav-link">Mes favoris</a>
                        <div class="nav-user-menu">
                            <button type="button" class="nav-user-toggle" aria-haspopup="menu" aria-expanded="false">
                                <span class="nav-user">{{ user.name or user.sub }}</span>
                                <span class="nav-user-caret" aria-hidden="true">▾</span>
                            </button>
                            <div class="nav-user-dropdown" role="menu">
                                {% if is_admin %}
                                <a href="/admin" class="nav-dropdown-item" role="menuitem">Administration Recettes</a>
                                <a href="/admin/config" class="nav-dropdown-item" role="menuitem">Administration Système</a>
                                {% endif %}
                                <a href="{{ logout_url }}" class="nav-dropdown-item" role="menuitem">Déconnexion</a>
                            </div>
                        </div>
                    {% else %}
                        <a href="{{ login_url }}" class="nav-link nav-login">Connexion</a>
                    {% endif %}
                {% endif %}
            </nav>
        </div>
    </header>
    <main class="{% block main_class %}{% endblock %}">
        {% block content %}{% endblock %}
    </main>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function () {
                navigator.serviceWorker.register('/static/sw.js').catch(function () {});
            });
        }
    </script>
    <script>
        (function () {
            var toggle = document.getElementById('theme-toggle');
            if (!toggle) return;
            function refreshIcon() {
                toggle.textContent = document.documentElement.dataset.theme === 'dark' ? '\u2600\uFE0F' : '\uD83C\uDF19';
            }
            refreshIcon();
            toggle.addEventListener('click', function () {
                var next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
                document.documentElement.dataset.theme = next;
                try { localStorage.setItem('theme', next); } catch (e) {}
                refreshIcon();
            });
        })();
        (function () {
            var menus = document.querySelectorAll('.nav-user-menu');
            menus.forEach(function (menu) {
                var trigger = menu.querySelector('.nav-user-toggle');
                if (!trigger) return;
                trigger.addEventListener('click', function (e) {
                    e.preventDefault();
                    var open = menu.classList.toggle('open');
                    trigger.setAttribute('aria-expanded', open ? 'true' : 'false');
                });
            });
            document.addEventListener('click', function (e) {
                menus.forEach(function (menu) {
                    if (!menu.contains(e.target)) {
                        menu.classList.remove('open');
                        var t = menu.querySelector('.nav-user-toggle');
                        if (t) t.setAttribute('aria-expanded', 'false');
                    }
                });
            });
        })();
    </script>
</body>
</html>
