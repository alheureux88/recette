{% extends "base.html" %}
{% block title %}Administration — Recettes Merizzi{% endblock %}
{% block content %}
<h1 class="page-title">Administration</h1>
<div class="admin-filters admin-tabs">
    <button class="filter-chip{% if tab != 'config' %} active{% endif %}"
            hx-get="/admin"
            hx-select="#admin-content"
            hx-target="#admin-content"
            hx-push-url="true">
        Recettes
    </button>
    <button class="filter-chip{% if tab == 'config' %} active{% endif %}"
            hx-get="/admin?tab=config"
            hx-select="#admin-content"
            hx-target="#admin-content"
            hx-push-url="true">
        Configuration
    </button>
</div>
<div id="admin-content">
    {% if tab == 'config' %}
    {% include "partials/admin_config.html" %}
    {% else %}
    {% include "partials/admin_table.html" %}
    {% endif %}
</div>
{% endblock %}
