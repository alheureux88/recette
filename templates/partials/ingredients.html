<section class="ingredients" id="ingredients-section">
    <h2>{{ _('recipe.ingredients') }}</h2>

    {% if ingredients_structures %}
    <form class="ingredient-controls"
          hx-get="/recipe/{{ recipe.id }}/ingredients"
          hx-target="#ingredients-section"
          hx-swap="outerHTML"
          hx-trigger="change">
        {% if base_servings %}
        <label class="servings-field">
            <span>{{ _('recipe.servings') }}</span>
            <input type="number" name="servings" min="1" max="99" step="1"
                   value="{{ current_servings if current_servings is not none else '' }}">
        </label>
        {% else %}
        <label class="servings-field">
            <span>{{ _('recipe.multiplier') }}</span>
            <input type="number" name="multiplier" min="0.25" max="99" step="0.25"
                   value="{{ '%g'|format(current_multiplier) }}">
        </label>
        {% endif %}
        <label class="units-field">
            <span>{{ _('recipe.units') }}</span>
            <select name="units">
                <option value="original"{% if units_system == "original" %} selected{% endif %}>{{ _('recipe.units_original') }}</option>
                <option value="metric"{% if units_system == "metric" %} selected{% endif %}>{{ _('recipe.units_metric') }}</option>
                <option value="imperial"{% if units_system == "imperial" %} selected{% endif %}>{{ _('recipe.units_imperial') }}</option>
            </select>
        </label>
    </form>
    {% endif %}

    <ul>
        {% for item in display_ingredients %}
        <li>{{ item }}</li>
        {% endfor %}
    </ul>
</section>
