<button
    class="fav-btn {% if is_favorite %}is-favorite{% endif %}"
    hx-post="/favorites/{{ slug }}"
    hx-swap="outerHTML"
    title="{{ _('favorites.remove') if is_favorite else _('favorites.add') }}"
>
    <span class="fav-icon">{% if is_favorite %}★{% else %}☆{% endif %}</span>
</button>
