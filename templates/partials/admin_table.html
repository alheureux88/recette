<div class="admin-toolbar">
    <div class="admin-filters recipes-filters">
        <button type="button" class="filter-chip active" data-filter-key="">{{ _('admin.filter_all') }}</button>
        <button type="button" class="filter-chip" data-filter-key="no_tags">{{ _('admin.filter_no_tags') }}</button>
        <button type="button" class="filter-chip" data-filter-key="no_category">{{ _('admin.filter_no_category') }}</button>
        {% for fam in all_tag_families %}
        <button type="button" class="filter-chip" data-filter-key="no_family:{{ fam.name }}">{{ _('admin.filter_no_family', family=fam.display_name) }}</button>
        {% endfor %}
    </div>
    <div class="bulk-edit">
        <span class="selection-count"><span id="selection-count">0</span> {{ _('admin.selection_count', n=99999).replace('99999', '') }}</span>
        <label class="bulk-field">
            <span>{{ _('admin.bulk_category') }}</span>
            <select id="bulk-category">
                <option value="">{{ _('admin.bulk_none') }}</option>
                {% for cat in all_categories %}
                <option value="{{ cat.name }}">{{ cat.display_name }}</option>
                {% endfor %}
            </select>
        </label>
        <button type="button" class="btn-apply" onclick="recetteBulkCategory()">{{ _('admin.bulk_apply') }}</button>
        <label class="bulk-field">
            <span>{{ _('admin.bulk_add_tags') }}</span>
            <select id="bulk-tags-add" multiple size="3">
                {% for family, tags in all_tags.items() %}
                <optgroup label="{{ family }}">
                    {% for tag in tags %}
                    <option value="{{ family }}:{{ tag.name }}">{{ tag.display_name }}</option>
                    {% endfor %}
                </optgroup>
                {% endfor %}
            </select>
        </label>
        <button type="button" class="btn-apply" onclick="recetteBulkTags('add')">{{ _('admin.bulk_add') }}</button>
        <label class="bulk-field">
            <span>{{ _('admin.bulk_remove_tags') }}</span>
            <select id="bulk-tags-remove" multiple size="3">
                {% for family, tags in all_tags.items() %}
                <optgroup label="{{ family }}">
                    {% for tag in tags %}
                    <option value="{{ family }}:{{ tag.name }}">{{ tag.display_name }}</option>
                    {% endfor %}
                </optgroup>
                {% endfor %}
            </select>
        </label>
        <button type="button" class="btn-cancel" onclick="recetteBulkTags('remove')">{{ _('admin.bulk_remove') }}</button>
    </div>
</div>
<div id="recipes-table"></div>

<h2 class="admin-section-title">{{ _('admin.blacklist_title') }}</h2>
<div id="blacklist-table"></div>

<h2 class="admin-section-title">{{ _('admin.failed_title') }}</h2>
<div id="failed-table"></div>

<script>
    window.recetteI18n = {
        tab_recipe: {{ _('admin.tab_recipe')|tojson }},
        tab_provenance: {{ _('admin.tab_provenance')|tojson }},
        tab_ingestion: {{ _('admin.tab_ingestion')|tojson }},
        tab_file: {{ _('admin.tab_file')|tojson }},
        tab_category: {{ _('admin.tab_category')|tojson }},
        tab_tags: {{ _('admin.tab_tags')|tojson }},
        tab_manual: {{ _('admin.tab_manual')|tojson }},
        tab_favorites: {{ _('admin.tab_favorites')|tojson }},
        empty_recipes: {{ _('admin.empty_recipes')|tojson }},
        empty_blacklist: {{ _('admin.empty_blacklist')|tojson }},
        empty_failed: {{ _('admin.empty_failed')|tojson }},
        col_path: {{ _('admin.col_path')|tojson }},
        col_provenance: {{ _('admin.col_provenance')|tojson }},
        col_date: {{ _('admin.col_date')|tojson }},
        col_error: {{ _('admin.col_error')|tojson }},
        action_edit: {{ _('admin.action_edit')|tojson }},
        action_blacklist: {{ _('admin.action_blacklist')|tojson }},
        action_restore: {{ _('admin.action_restore')|tojson }},
        action_retry: {{ _('admin.action_retry')|tojson }},
        confirm_blacklist: {{ _('admin.confirm_blacklist')|tojson }},
        confirm_unblacklist: {{ _('admin.confirm_unblacklist')|tojson }},
        confirm_retry: {{ _('admin.confirm_retry')|tojson }},
        confirm_select_first: {{ _('admin.confirm_select_first')|tojson }},
        confirm_pick_tag: {{ _('admin.confirm_pick_tag')|tojson }},
        bulk_add_action: {{ _('admin.bulk_add_action')|tojson }},
        bulk_remove_action: {{ _('admin.bulk_remove_action')|tojson }},
        alert_save_error: {{ _('admin.alert_save_error')|tojson }},
        alert_update_error: {{ _('admin.alert_update_error')|tojson }},
        ok: {{ _('admin.cancel')|tojson }},
        cancel: {{ _('admin.cancel')|tojson }},
    };
</script>

<script>
    window.recetteEscape = function (value) {
        return String(value == null ? "" : value).replace(/[&<>"']/g, function (c) {
            return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
        });
    };

    async function recettePostJson(url, payload) {
        var res = await fetch(url, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload),
        });
        if (!res.ok) throw new Error("HTTP " + res.status);
        return res.json();
    }

    window.recetteApplyFilter = function (key) {
        window.__recetteFilterKey = key;
        document.querySelectorAll(".recipes-filters .filter-chip").forEach(function (chip) {
            chip.classList.toggle("active", (chip.dataset.filterKey || "") === key);
        });
        var table = window.__recetteTable;
        if (!table) return;
        if (key === "no_tags") {
            table.setFilter(function (data) { return !data.tags || data.tags.length === 0; });
        } else if (key === "no_category") {
            table.setFilter(function (data) { return !data.category_name; });
        } else if (key && key.indexOf("no_family:") === 0) {
            var fam = key.slice("no_family:".length);
            table.setFilter(function (data) {
                return !(data.tags || []).some(function (t) { return t.family === fam; });
            });
        } else {
            table.clearFilter();
        }
    };

    function recetteUpdateSelectionCount(count) {
        var counter = document.getElementById("selection-count");
        if (counter) counter.textContent = String(count);
    }

    window.recetteRefreshTable = async function () {
        if (!window.__recetteTable) return;
        await window.__recetteTable.replaceData();
        recetteUpdateSelectionCount(0);
    };

    window.recetteAdminEdit = function (id) {
        htmx.ajax("GET", "/admin/edit/" + id, "#admin-content");
    };

    window.recetteAdminBlacklist = function (id) {
        if (!confirm(window.recetteI18n.confirm_blacklist)) return;
        htmx.ajax("POST", "/admin/blacklist/" + id, "#admin-content");
    };

    window.recetteUnblacklist = function (encodedPath) {
        if (!confirm(window.recetteI18n.confirm_unblacklist)) return;
        htmx.ajax("POST", "/admin/unblacklist?path=" + encodedPath, "#admin-content");
    };

    window.recetteRetryFailed = function (encodedPath) {
        if (!confirm(window.recetteI18n.confirm_retry)) return;
        htmx.ajax("POST", "/admin/retry-failed?path=" + encodedPath, "#admin-content");
    };

    window.recetteCellSaved = async function (cell) {
        var id = cell.getData().id;
        try {
            if (cell.getField() === "category_name") {
                await recettePostJson("/admin/inline/" + id + "/category",
                    { category: cell.getValue() || null });
            } else if (cell.getField() === "tags") {
                await recettePostJson("/admin/inline/" + id + "/tags",
                    { tags: cell.getValue() || [] });
            }
        } catch (e) {
            alert(window.recetteI18n.alert_save_error);
        }
        recetteRefreshTable();
    };

    window.recetteTagEditor = function (cell, onRendered, success, cancel) {
        var container = document.createElement("div");
        container.className = "tag-editor";
        var current = {};
        (cell.getValue() || []).forEach(function (t) { current[t.family + ":" + t.name] = true; });

        var select = document.createElement("select");
        select.multiple = true;
        var groups = window.__recetteTags || {};
        Object.keys(groups).forEach(function (family) {
            var group = document.createElement("optgroup");
            group.label = family;
            groups[family].forEach(function (t) {
                var opt = document.createElement("option");
                opt.value = family + ":" + t.name;
                opt.textContent = t.display_name;
                if (current[opt.value]) opt.selected = true;
                group.appendChild(opt);
            });
            select.appendChild(group);
        });

        var actions = document.createElement("div");
        actions.className = "tag-editor-actions";
        var okBtn = document.createElement("button");
        okBtn.type = "button";
        okBtn.className = "tag-editor-ok";
        okBtn.textContent = "OK";
        okBtn.addEventListener("click", function (e) {
            e.stopPropagation();
            success(Array.prototype.map.call(select.selectedOptions, function (o) { return o.value; }));
        });
        var cancelBtn = document.createElement("button");
        cancelBtn.type = "button";
        cancelBtn.className = "tag-editor-cancel";
        cancelBtn.textContent = window.recetteI18n.cancel;
        cancelBtn.addEventListener("click", function (e) { e.stopPropagation(); cancel(); });
        actions.appendChild(okBtn);
        actions.appendChild(cancelBtn);

        container.appendChild(select);
        container.appendChild(actions);
        onRendered(function () { select.focus(); });
        return container;
    };

    window.recetteBulkCategory = async function () {
        var table = window.__recetteTable;
        if (!table) return;
        var ids = table.getSelectedData().map(function (r) { return r.id; });
        if (!ids.length) { alert(window.recetteI18n.confirm_select_first); return; }
        var msg = {{ _('admin.confirm_apply_category', n='IDS')|tojson }}.replace('IDS', ids.length);
        if (!confirm(msg)) return;
        try {
            await recettePostJson("/admin/bulk/category", {
                ids: ids,
                category: document.getElementById("bulk-category").value || null,
            });
        } catch (e) {
            alert(window.recetteI18n.alert_update_error);
            return;
        }
        table.deselectRow();
        recetteRefreshTable();
    };

    window.recetteBulkTags = async function (mode) {
        var table = window.__recetteTable;
        if (!table) return;
        var ids = table.getSelectedData().map(function (r) { return r.id; });
        if (!ids.length) { alert(window.recetteI18n.confirm_select_first); return; }
        var sel = document.getElementById(mode === "add" ? "bulk-tags-add" : "bulk-tags-remove");
        var keys = Array.prototype.map.call(sel.selectedOptions, function (o) { return o.value; });
        if (!keys.length) { alert(window.recetteI18n.confirm_pick_tag); return; }
        var verbe = mode === "add" ? window.recetteI18n.bulk_add_action : window.recetteI18n.bulk_remove_action;
        var template = {{ _('admin.confirm_bulk_tags', action='VERB', n='N', count='COUNT')|tojson }};
        if (!confirm(template.replace('VERB', verbe).replace('N', keys.length).replace('COUNT', ids.length))) return;
        try {
            await recettePostJson("/admin/bulk/tags", mode === "add"
                ? { ids: ids, add: keys, remove: [] }
                : { ids: ids, add: [], remove: keys });
        } catch (e) {
            alert(window.recetteI18n.alert_update_error);
            return;
        }
        table.deselectRow();
        recetteRefreshTable();
    };

    (function () {
        var el = document.getElementById("recipes-table");
        if (!el || typeof Tabulator === "undefined") return;
        if (window.__recetteTable) {
            try { window.__recetteTable.destroy(); } catch (e) { /* ignore */ }
            window.__recetteTable = null;
        }

        function categoryValues() {
            var values = [{ label: window.recetteI18n.bulk_none, value: "" }];
            (window.__recetteCategories || []).forEach(function (c) {
                values.push({ label: c.display_name, value: c.name });
            });
            return values;
        }

        function tagsSorter(a, b) {
            var sa = (a || []).map(function (t) { return t.display_name; }).join(", ").toLowerCase();
            var sb = (b || []).map(function (t) { return t.display_name; }).join(", ").toLowerCase();
            return sa === sb ? 0 : sa < sb ? -1 : 1;
        }

        var table = new Tabulator(el, {
            layout: "fitColumns",
            placeholder: window.recetteI18n.empty_recipes,
            selectableRows: true,
            index: "id",
            initialSort: [{ column: "created_at", dir: "desc" }],
            ajaxURL: "/admin/recipes.json",
            ajaxResponse: function (url, params, response) {
                window.__recetteCategories = response.categories;
                window.__recetteTags = response.tags;
                return response.recipes;
            },
            columns: [
                {
                    formatter: "rowSelection",
                    titleFormatter: "rowSelection",
                    titleFormatterParams: { rowRange: "active" },
                    hozAlign: "center",
                    headerSort: false,
                    width: 40,
                },
                {
                    title: window.recetteI18n.tab_recipe,
                    field: "title",
                    minWidth: 170,
                    sorter: "string",
                    headerFilter: "input",
                    formatter: function (cell) {
                        var d = cell.getData();
                        return '<a href="/recipe/' + d.id + '" target="_blank">'
                            + recetteEscape(d.title) + "</a>";
                    },
                },
                {
                    title: window.recetteI18n.tab_provenance,
                    field: "provenance",
                    width: 110,
                    sorter: "string",
                    headerFilter: "input",
                    formatter: function (cell) {
                        return '<span class="card-provenance">'
                            + recetteEscape(cell.getValue()) + "</span>";
                    },
                },
                {
                    title: window.recetteI18n.tab_ingestion,
                    field: "created_at",
                    width: 145,
                    sorter: "string",
                    headerFilter: "input",
                },
                {
                    title: window.recetteI18n.tab_file,
                    field: "file_modified_at",
                    width: 145,
                    sorter: "string",
                    headerFilter: "input",
                    formatter: function (cell) { return recetteEscape(cell.getValue()) || "—"; },
                },
                {
                    title: window.recetteI18n.tab_category,
                    field: "category_name",
                    width: 150,
                    sorter: "string",
                    headerFilter: "list",
                    headerFilterParams: function () { return { values: categoryValues() }; },
                    formatter: function (cell) {
                        return recetteEscape(cell.getData().category_display_name) || "—";
                    },
                    editor: "list",
                    editorParams: function () {
                        return { values: categoryValues(), defaultValue: "", emptyValue: "" };
                    },
                    cellEdited: function (cell) { recetteCellSaved(cell); },
                },
                {
                    title: window.recetteI18n.tab_tags,
                    field: "tags",
                    minWidth: 230,
                    sorter: tagsSorter,
                    headerFilter: "input",
                    headerFilterFunc: function (term, val) {
                        if (!term) return true;
                        term = term.toLowerCase();
                        return (val || []).some(function (t) {
                            return t.display_name.toLowerCase().indexOf(term) !== -1;
                        });
                    },
                    formatter: function (cell) {
                        return (cell.getValue() || []).map(function (t) {
                            return '<span class="tag">' + recetteEscape(t.display_name) + "</span>";
                        }).join(" ");
                    },
                    editor: window.recetteTagEditor,
                    cellEdited: function (cell) { recetteCellSaved(cell); },
                },
                {
                    title: window.recetteI18n.tab_manual,
                    field: "manually_edited",
                    width: 85,
                    hozAlign: "center",
                    sorter: "boolean",
                    formatter: "tickCross",
                    headerFilter: "tickCross",
                    headerFilterParams: { tristate: true },
                },
                {
                    title: window.recetteI18n.tab_favorites,
                    field: "favorite_count",
                    width: 90,
                    hozAlign: "center",
                    sorter: "number",
                    headerFilter: "number",
                },
                {
                    title: "",
                    headerSort: false,
                    width: 190,
                    formatter: function (cell) {
                        var d = cell.getData();
                        return '<button class="btn-edit" onclick="event.stopPropagation();'
                            + 'recetteAdminEdit(' + d.id + ')">'
                            + recetteEscape(window.recetteI18n.action_edit) + '</button>'
                            + '<button class="btn-blacklist" onclick="event.stopPropagation();'
                            + 'recetteAdminBlacklist(' + d.id + ')">'
                            + recetteEscape(window.recetteI18n.action_blacklist) + '</button>';
                    },
                },
            ],
        });
        window.__recetteTable = table;

        table.on("rowSelectionChanged", function (data) {
            recetteUpdateSelectionCount(data.length);
        });

        // --- Tables des fichiers (blacklist et erreurs) ---
        if (window.__recetteBlacklistTable) {
            try { window.__recetteBlacklistTable.destroy(); } catch (e) { /* ignore */ }
            window.__recetteBlacklistTable = null;
        }
        if (window.__recetteFailedTable) {
            try { window.__recetteFailedTable.destroy(); } catch (e) { /* ignore */ }
            window.__recetteFailedTable = null;
        }

        function pathFormatter(cell) {
            return '<span class="path-cell">' + recetteEscape(cell.getValue()) + "</span>";
        }

        function provenanceFormatter(cell) {
            return '<span class="card-provenance">' + recetteEscape(cell.getValue()) + "</span>";
        }

        var filesCommonColumns = [
            {
                title: window.recetteI18n.col_path,
                field: "path",
                minWidth: 220,
                sorter: "string",
                headerFilter: "input",
                formatter: pathFormatter,
            },
            {
                title: window.recetteI18n.col_provenance,
                field: "provenance",
                width: 110,
                sorter: "string",
                headerFilter: "input",
                formatter: provenanceFormatter,
            },
        ];

        window.__recetteBlacklistTable = new Tabulator(
            document.getElementById("blacklist-table"),
            {
                layout: "fitColumns",
                placeholder: window.recetteI18n.empty_blacklist,
                index: "path",
                initialSort: [{ column: "date", dir: "desc" }],
                ajaxURL: "/admin/files.json",
                ajaxResponse: function (url, params, response) { return response.blacklisted; },
                columns: filesCommonColumns.concat([
                    {
                        title: window.recetteI18n.col_date,
                        field: "date",
                        width: 150,
                        sorter: "string",
                        headerFilter: "input",
                    },
                    {
                        title: "",
                        headerSort: false,
                        width: 120,
                        formatter: function (cell) {
                            return '<button class="btn-restore" onclick="event.stopPropagation();'
                                + 'recetteUnblacklist(\'' + encodeURIComponent(cell.getData().path)
                                + '\')">' + recetteEscape(window.recetteI18n.action_restore) + '</button>';
                        },
                    },
                ]),
            }
        );

        window.__recetteFailedTable = new Tabulator(document.getElementById("failed-table"), {
            layout: "fitColumns",
            placeholder: window.recetteI18n.empty_failed,
            index: "path",
            initialSort: [{ column: "date", dir: "desc" }],
            ajaxURL: "/admin/files.json",
            ajaxResponse: function (url, params, response) { return response.failed; },
            columns: filesCommonColumns.concat([
                {
                    title: window.recetteI18n.col_error,
                    field: "error",
                    minWidth: 200,
                    sorter: "string",
                    headerFilter: "input",
                    formatter: function (cell) {
                        return '<span class="error-cell">' + recetteEscape(cell.getValue()) + "</span>";
                    },
                },
                {
                    title: window.recetteI18n.col_date,
                    field: "date",
                    width: 145,
                    sorter: "string",
                    headerFilter: "input",
                },
                {
                    title: "",
                    headerSort: false,
                    width: 120,
                    formatter: function (cell) {
                        return '<button class="btn-retry" onclick="event.stopPropagation();'
                            + 'recetteRetryFailed(\'' + encodeURIComponent(cell.getData().path)
                            + '\')">' + recetteEscape(window.recetteI18n.action_retry) + '</button>';
                    },
                },
            ]),
        });

        document.querySelectorAll(".recipes-filters .filter-chip").forEach(function (chip) {
            chip.addEventListener("click", function () {
                recetteApplyFilter(chip.dataset.filterKey || "");
            });
        });
        recetteApplyFilter(window.__recetteFilterKey || "");
    })();
</script>
