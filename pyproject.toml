[project]
name = "recipes"
version = "0.1.0"
description = "Mom's recipe site — Dropbox sync + LLM tagging + FastAPI"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "jinja2>=3.1.4",
    "python-multipart>=0.0.9",
    "dropbox>=12.0.0",
    "openai>=1.30.0",
    "anthropic>=0.28.0",
    "mammoth>=1.8.0",
    "pdfplumber>=0.11.0",
    "pymupdf>=1.24.0",
    "odfpy>=1.4.1",
    "textract>=1.6.5",
    "chardet>=5.0.0",
    "apscheduler>=3.10.0",
]

[project.scripts]
recipes-serve = "recipes.main:app"
recipes-poll  = "recipes.poller:run"

[build-system]
requires      = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/recipes"]

# ---------------------------------------------------------------------------
# Dev dependencies (uv groups)
# ---------------------------------------------------------------------------
[dependency-groups]
dev = [
    "nox>=2024.4.15",
    "pre-commit>=3.7.0",
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",        # FastAPI test client
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

# ---------------------------------------------------------------------------
# Ruff — linting + formatting
# ---------------------------------------------------------------------------
[tool.ruff]
src            = ["src"]
line-length    = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.lint.isort]
known-first-party = ["recipes"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Query", "fastapi.Depends", "fastapi.Path"]

# ---------------------------------------------------------------------------
# Mypy — type checking
# ---------------------------------------------------------------------------
[tool.mypy]
python_version         = "3.12"
mypy_path              = "src"
strict                 = true
ignore_missing_imports = true   # third-party stubs aren't always available

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths      = ["tests"]
asyncio_mode   = "auto"
addopts        = "--cov=recipes --cov-report=term-missing"
