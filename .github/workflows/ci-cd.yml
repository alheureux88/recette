name: CI/CD Pipeline

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'

env:
  REGISTRY: ghcr.io

jobs:
  # =========================================================================
  # Job 1: Quality Checks & Image Building (Runs on GitHub's Secure Cloud)
  # =========================================================================
  pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # Needed to publish the image to GHCR

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Nox
        run: uv pip install --system nox

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Step 1: Run your quality checks via Nox
      - name: Run Quality Checks
        run: nox -s lint typecheck test

      # Step 2: Build ONCE and push all required tags
      - name: Build & Push Docker Image
        env:
          IMAGE_NAME: ghcr.io/${{ github.repository }}
        run: |
          # Convert repository name to lowercase safely for Docker compliance
          LOW_IMAGE=$(echo "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')
          
          # Build the image using your noxfile with free GitHub Actions layer caching
          IMAGE_NAME=$LOW_IMAGE IMAGE_TAG=latest nox -s docker -- --cache-from=type=gha --cache-to=type=gha,mode=max
          docker push $LOW_IMAGE:latest
          
          # If this execution is driven by a version tag, also tag and push 'version' and 'stable'
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION_TAG="${{ github.ref_name }}"
          
            # Tag and push precise version (e.g., v1.0.0)
            docker tag $LOW_IMAGE:latest $LOW_IMAGE:$VERSION_TAG
            docker push $LOW_IMAGE:$VERSION_TAG
          
            # Tag and push 'stable' (overwrites previous stable image for Portainer tracking)
            docker tag $LOW_IMAGE:latest $LOW_IMAGE:stable
            docker push $LOW_IMAGE:stable
          fi

      # Step 3: Automatically delete old, untagged images to save free tier space
      - name: Prune Old Untagged Images
        uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ github.event.repository.name }}
          package-type: 'container'
          min-versions-to-keep: 3
          delete-only-untagged-versions: 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # =========================================================================
  # Job 2: Secure Outbound Deploy (Runs ONLY on your self-hosted server runner)
  # =========================================================================
  deploy:
    needs: pipeline
    runs-on: self-hosted                      # Executes locally inside your home network
    if: startsWith(github.ref, 'refs/tags/v') # CRUCIAL: Blocks arbitrary PRs from executing on your runner

    permissions:
      contents: read
      packages: none
      statuses: none
      checks: none

    steps:
      - name: Trigger Private Portainer Webhook
        run: |
          # Sends an isolated HTTP POST request straight to your internal Portainer engine
          # Masked cleanly behind your encrypted GitHub Repository Secrets
          curl --insecure -X POST "${{ secrets.PORTAINER_WEBHOOK_URL }}"
